name: iOS Verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -n 10

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: BizScanCore tests (SwiftPM)
        run: |
          set -o pipefail
          mkdir -p artifacts
          swift test --package-path Packages/BizScanCore 2>&1 | tee artifacts/verify-core.log

      - name: Generate project
        run: xcodegen generate

      - name: xcodebuild test
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild test \
            -project BizScan.xcodeproj \
            -scheme BizScan \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath artifacts/verify-ci.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/verify-ci.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.sha }}
          path: artifacts/
          retention-days: 14
